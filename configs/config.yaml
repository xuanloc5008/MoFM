project_name: "Topo-Evidential-U-Mamba"
seed: 42

paths:
  # ── Exact directory names as provided ──────────────────────────────────
  # Place datasets relative to the project root, OR use absolute paths.
  #
  # Expected structures:
  #   ACDC-dataset/database/training/patient001/Info.cfg
  #   ACDC-dataset/database/testing/patient101/...
  #   M&M1/Testing/{ID}/{ID}_sa.nii.gz
  #   M&M1/Training/Labeled/{ID}/{ID}_sa.nii.gz
  #   M&M1/Validation/{ID}/{ID}_sa.nii.gz
  #   M&M1/211230_M&M...csv
  #   MnM2/dataset/{ID}/{ID}_SA_ED.nii.gz
  #   MnM2/dataset_information.csv
  acdc_root:   "/Volumes/Transcend/ACDC-dataset/database"   # → data/ACDC-dataset/database/training/
  mnm1_root:   "/Volumes/Transcend/M&M1"           # → data/M&M1/Testing/, Validation/, Training/Labeled/
  mnm2_root:   "/Volumes/Transcend/MnM2"           # → data/MnM2/dataset/027/027_SA_ED.nii.gz
  output_dir:  "outputs"
  preprocessed_root: "outputs/preprocessed/mnm1_mnm2_train_acdc_external"
  preprocessed_acdc_root: "outputs/preprocessed/acdc"
  checkpoint_dir: "outputs/checkpoints"
  log_dir:     "outputs/logs"
  figure_dir:  "outputs/figures"

data:
  num_classes: 4          # 0=BG, 1=RV, 2=Myo, 3=LV
  class_names: ["BG", "RV", "Myo", "LV"]
  spatial_size: [224, 224]   # 2-D slice size after crop/pad
  in_channels: 1
  # Multi-vendor training setup:
  #   train = M&Ms-1 labeled training/validation + all M&Ms-2 labeled subjects
  #   val   = ACDC external validation split below
  train_datasets: ["mnm1", "mnm2"]
  validation_dataset: "acdc"
  mnm1_train_splits: ["Training", "Validation"]
  # Use "training" by default because official ACDC testing labels are often unavailable.
  # Switch to "testing" here if your local ACDC test split includes *_gt.nii.gz labels.
  acdc_external_split: "training"
  use_preprocessed: true
  # Legacy ACDC-only split/cache flags are kept for backwards compatibility.
  acdc_val_ratio: 0.20
  use_preprocessed_acdc: false
  cache_rate: 0.5            # MONAI cache fraction

augmentation:
  # ── Spatial ─────────────────────────────────────────────────────────────────
  rand_rotate_prob: 0.75
  rand_rotate_range: 0.3491         # ~20 degrees
  rand_flip_prob: 0.0               # disabled — cardiac SA MRI is aligned
  rand_affine_prob: 0.75
  rand_translate_range: [12, 12]
  rand_shear_range: [0.04, 0.04]
  rand_elastic_prob: 0.25
  rand_elastic_spacing: [24, 24]
  rand_elastic_magnitude: [1.5, 4.0]
  rand_zoom_prob: 0.55
  rand_zoom_range: [0.8, 1.2]
  # ── Intensity / scanner-style (strengthened for domain shift robustness) ────
  # Simulates Canon/GE/Philips/Siemens appearance variation at training time
  # so z_topo and c_app are forced to disentangle style from structure.
  rand_gaussian_noise_prob: 0.30    # 0.25→0.30
  rand_gaussian_noise_std: 0.07    # 0.05→0.07
  rand_gaussian_smooth_prob: 0.25  # 0.20→0.25
  rand_gaussian_smooth_sigma: [0.25, 1.5]   # wider sigma
  rand_bias_field_prob: 0.45       # 0.35→0.45 (B1 inhomogeneity — vendor-specific)
  rand_bias_field_coeff_range: [0.0, 0.20]  # 0.12→0.20
  rand_gibbs_noise_prob: 0.30      # 0.25→0.30
  rand_gibbs_alpha: [0.0, 0.80]   # slightly more ringing artefacts
  rand_adjust_contrast_prob: 0.45  # 0.35→0.45
  rand_adjust_contrast_gamma: [0.5, 1.8]    # [0.7,1.4]→[0.5,1.8] wider range
  rand_scale_intensity_prob: 0.30  # 0.25→0.30
  rand_scale_intensity_factor: 0.25         # 0.20→0.25
  rand_shift_intensity_prob: 0.30  # 0.25→0.30
  rand_shift_intensity_offset: 0.15         # 0.10→0.15
  # ── Histogram shift (new — simulates scanner-specific LUT differences) ─────
  rand_histogram_shift_prob: 0.30
  rand_histogram_shift_num_control_points: 10

model:
  feature_channels: [32, 64, 128, 256, 512]
  ssm_d_state: 16
  ssm_expand_factor: 2
  projection_dim: 128      # d_z: topology latent dim (topology head + contrastive)
  context_dim: 64          # d_app: residual context encoder output dim
  d_token: 128             # anchor token dim — must equal feature_channels[-3]=128
  ca_num_heads: 4          # cross-attention heads at D3
  dropout: 0.1

topology:
  max_dimension: 1          # H0 + H1 persistence
  filtration: "sublevel"
  pd_threshold: 0.02        # min persistence to keep
  wasserstein_p: 1          # W1 distance
  cache_downsample_size: 64 # preprocessing resolution for cached topology vectors
  cache_top_k: 8            # top persistence values kept per homology dimension
  topo_positive_top_k: 4    # use only the top-k topology neighbours as positives
  topo_positive_threshold: 0.6   # fallback threshold when top-k mining is disabled

loss:
  # ── Loss weights (rebalanced from v1) ───────────────────────────────────────
  # gamma reduced 0.1→0.05: contrastive raw ~3.3 → weighted ~0.165 (was 0.33)
  #   This stops the contrastive term from dominating (was ~82% of total loss).
  # dice_weight increased 0.5→1.0: more gradient signal to segmentation, esp. RV.
  # lambda_dist (new): anchors μ/σ² to z_topo; stabilises latent clusters.
  gamma: 0.05               # L_metric (contrastive) weight
  dice_weight: 1.0          # L_Dice weight
  lambda_dist: 0.05         # L_dist (anchor distribution) weight
  dice_include_background: false
  edl_class_weights: [0.2, 1.5, 1.0, 1.0]   # [BG, RV, Myo, LV] — RV bump 1.4→1.5
  lambda_t_schedule:        # EDL KL annealing
    start: 0.0
    end: 1.0
    warmup_epochs: 20
  temperature: 0.1          # contrastive τ

training:
  epochs: 200
  batch_size: 8
  num_workers: 4
  learning_rate: 2.0e-4
  weight_decay: 1.0e-5
  lr_scheduler: "cosine"
  warmup_epochs: 5
  grad_clip: 1.0
  val_interval: 1
  save_best_metric: "val_dice_mean"

runtime:
  profiles:
    # Applied first for every device, then overridden by the active backend
    # profile below.
    default: {}

    # Stable profile for Apple Silicon / Metal.
    # Keeps DataLoader single-process and uses smaller batches.
    mps:
      train_batch_size: 4
      val_batch_size: 4
      num_workers: 0
      pin_memory: false
      persistent_workers: false
      prefetch_factor: null
      non_blocking: false
      use_amp: false
      amp_dtype: "float32"
      matmul_precision: "high"
      cudnn_benchmark: false
      cudnn_deterministic: false

    # Generic CUDA profile: fast host/device transfer, persistent workers,
    # AMP in BF16, and TF32 enabled for tensor-core throughput.
    cuda:
      num_workers: 8
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      non_blocking: true
      use_amp: true
      amp_dtype: "bfloat16"
      allow_tf32: true
      matmul_precision: "high"
      cudnn_benchmark: true
      cudnn_deterministic: false

    # Specific override for NVIDIA L40 / L40S-class cards.
    # Cached topology features remove the old per-batch CPU PH bottleneck, so
    # we can push batch size and dataloader throughput harder here.
    cuda_l40:
      train_batch_size: 24
      val_batch_size: 48
      num_workers: 12
      prefetch_factor: 6
      pin_memory: true
      persistent_workers: true
      non_blocking: true
      use_amp: true
      amp_dtype: "bfloat16"
      allow_tf32: true
      matmul_precision: "high"
      cudnn_benchmark: true

evaluation:
  hausdorff_percentile: 95   # HD95
  ece_bins: 15
  uncertainty_threshold: 0.5
